<!DOCTYPE html>
<html lang="en">
<head>
  
  
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan B · Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/plan-b-base.css?v=1080x1920" />
  <link rel="stylesheet" href="css/plan-b-modal-detail.css" />
  <link rel="stylesheet" href="css/plan-b-profile.css" />
  <link rel="stylesheet" href="css/plan-b-immersive.css" />
  <link rel="stylesheet" href="css/plan-b-pilates-report.css" />
  <link rel="stylesheet" href="css/plan-b-auth.css" />
</head>
<body data-plan-b-page="register">
  <main class="device-shell" aria-label="Plan B register page">
    <div class="particle-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="auth-screen" aria-label="Register">

      <section class="auth-card">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Set up your Plan B account in two steps.</p>

        <div class="auth-form">
          <div class="auth-field">
            <label for="registerUsername">Username</label>
            <input class="auth-input" id="registerUsername" type="text" placeholder="Enter username" />
          </div>

          <div class="auth-field">
            <label for="registerEmail">Email</label>
            <input class="auth-input" id="registerEmail" type="email" placeholder="name@email.com" />
          </div>

          <div class="auth-field">
            <label for="registerCode">Verification Code</label>
            <div class="auth-input-row">
              <input class="auth-input" id="registerCode" type="text" placeholder="6-digit code" />
              <button class="auth-secondary-btn" type="button">Send Code</button>
            </div>
          </div>

          <div class="auth-field">
            <label for="registerPassword">Password</label>
            <input class="auth-input" id="registerPassword" type="password" placeholder="Set your password" />
          </div>

          <div class="auth-field">
            <label for="registerConfirmPassword">Confirm Password</label>
            <input class="auth-input" id="registerConfirmPassword" type="password" placeholder="Re-enter your password" />
          </div>

          <label class="auth-check-row" for="registerPolicyAgree">
            <input id="registerPolicyAgree" type="checkbox" />
            <span>I have read and agree to the <a href="#" aria-label="User Agreement">User Agreement</a> and <a href="#" aria-label="Privacy Policy">Privacy Policy</a>.</span>
          </label>

          <button class="auth-primary-btn" id="registerNextBtn" type="button">Next</button>
        </div>
      </section>
      <div class="action-dock" aria-label="Page actions">
        <button class="action-dock-back-btn auth-back-btn" data-auth-back="plan-b-login.html" type="button" aria-label="Back">Back</button>
      </div>
    </section>

    <div class="auth-toast is-hidden" id="authToast" aria-live="polite"></div>
  </main>

  <script src="js/plan-b-auth.js" defer></script>
</body>
</html>
