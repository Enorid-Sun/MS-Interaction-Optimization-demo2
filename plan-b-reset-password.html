<!DOCTYPE html>
<html lang="en">
<head>
  
  
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan B · Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/plan-b-base.css?v=1080x1920" />
  <link rel="stylesheet" href="css/plan-b-modal-detail.css" />
  <link rel="stylesheet" href="css/plan-b-profile.css" />
  <link rel="stylesheet" href="css/plan-b-immersive.css" />
  <link rel="stylesheet" href="css/plan-b-pilates-report.css" />
  <link rel="stylesheet" href="css/plan-b-auth.css" />
</head>
<body data-plan-b-page="account-reset-password">
  <main class="device-shell" aria-label="Plan B account reset password page">
    <div class="particle-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="auth-screen" aria-label="Reset password">

      <section class="auth-card">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your account email and set a new password.</p>

        <div class="auth-form">
          <div class="auth-field">
            <label for="forgotEmail">Email</label>
            <input class="auth-input" id="forgotEmail" type="email" placeholder="name@email.com" value="alyona@email.com" />
          </div>

          <div class="auth-field">
            <label for="forgotCode">Verification Code</label>
            <div class="auth-input-row">
              <input class="auth-input" id="forgotCode" type="text" placeholder="6-digit code" />
              <button class="auth-secondary-btn" type="button">Send Code</button>
            </div>
          </div>

          <div class="auth-field">
            <label for="forgotPassword">Set Password</label>
            <input class="auth-input" id="forgotPassword" type="password" placeholder="Enter new password" />
          </div>

          <div class="auth-field">
            <label for="forgotConfirmPassword">Confirm Password</label>
            <input class="auth-input" id="forgotConfirmPassword" type="password" placeholder="Re-enter new password" />
          </div>

          <button class="auth-primary-btn" id="resetPasswordSaveBtn" type="button">Save Changes</button>
        </div>
      </section>
      <div class="action-dock" aria-label="Page actions">
        <button class="action-dock-back-btn auth-back-btn" id="resetPasswordBackBtn" type="button" aria-label="Back">Back</button>
      </div>
    </section>

    <div class="auth-toast is-hidden" id="authToast" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      const backBtn = document.getElementById("resetPasswordBackBtn");
      const saveBtn = document.getElementById("resetPasswordSaveBtn");
      const passwordInput = document.getElementById("forgotPassword");
      const confirmInput = document.getElementById("forgotConfirmPassword");
      const toast = document.getElementById("authToast");

      const showToast = (message, duration = 1500) => {
        if (!toast) return;
        toast.textContent = message;
        toast.classList.remove("is-hidden");
        window.clearTimeout(showToast._timer);
        showToast._timer = window.setTimeout(() => {
          toast.classList.add("is-hidden");
        }, duration);
      };

      backBtn?.addEventListener("click", () => {
        window.location.href = "plan-b-account-settings.html";
      });

      saveBtn?.addEventListener("click", () => {
        if (passwordInput && confirmInput && passwordInput.value !== confirmInput.value) {
          showToast("Passwords do not match");
          return;
        }
        showToast("Password reset successfully");
        window.setTimeout(() => {
          window.location.href = "plan-b-account-settings.html";
        }, 900);
      });
    })();
  </script>
</body>
</html>
